# Name of the GitHub Actions workflow
name: Python CI

# Trigger the workflow when:
# 1. Code is pushed to the main branch
# 2. A pull request is created/updated for the main branch
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Define the jobs that GitHub Actions will execute
jobs:

  # Job name: test
  test:

    # Run the job on a fresh Ubuntu virtual machine
    runs-on: ubuntu-latest

    # Steps executed one by one
    steps:

      # Step 1: Download/checkout the repository code
      # This makes our GitHub repository files available
      # inside the GitHub Actions runner
      - name: Check out code
        uses: actions/checkout@v4

      # Step 2: Install and configure Python
      # We are using Python version 3.8
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      # Step 3: Install the Python dependencies
      # First upgrade pip
      # Then install all packages mentioned in requirement.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      # Step 4: Run the pytest test cases
      # Using "python -m pytest" ensures pytest runs
      # through the configured Python environment
      - name: Run tests
        run: python -m pytest
